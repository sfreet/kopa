version: '3.8'

services:
  webhook:
    build: .
    image: opa-webhook:latest
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    mem_limit: 512m
    ports:
      - "8443:8443"
    volumes:
      # Mount the certificate files from the host into the container.
      - ./server.crt:/app/server.crt:ro
      - ./server.key:/app/server.key:ro
      - ./opa-ca.crt:/app/opa-ca.crt:ro
    env_file:
      - .env
    restart: unless-stopped
